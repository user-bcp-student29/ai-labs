<!-- auth-login.component.html -->
<form
  #loginForm="ngForm"
  (ngSubmit)="submit(loginForm)"
  [attr.aria-busy]="submitting"
  novalidate
>
  <div class="field">
    <label for="username">Usuario</label>
    <input
      id="username"
      name="username"
      type="text"
      autocomplete="username"
      required
      [(ngModel)]="username"
      #usernameControl="ngModel"
      [disabled]="submitting"
      [attr.aria-invalid]="
        usernameControl.invalid &&
        (usernameControl.touched || loginForm.submitted)
          ? 'true'
          : null
      "
      aria-describedby="username-error"
    />
    <p
      *ngIf="
        usernameControl.invalid &&
        (usernameControl.touched || loginForm.submitted)
      "
      id="username-error"
      class="field-error"
    >
      El usuario es obligatorio.
    </p>
  </div>

  <div class="field">
    <label for="password">Contraseña</label>
    <input
      id="password"
      name="password"
      type="password"
      autocomplete="current-password"
      required
      [(ngModel)]="password"
      #passwordControl="ngModel"
      [disabled]="submitting"
      [attr.aria-invalid]="
        passwordControl.invalid &&
        (passwordControl.touched || loginForm.submitted)
          ? 'true'
          : null
      "
      aria-describedby="password-error"
    />
    <p
      *ngIf="
        passwordControl.invalid &&
        (passwordControl.touched || loginForm.submitted)
      "
      id="password-error"
      class="field-error"
    >
      La contraseña es obligatoria.
    </p>
  </div>

  <button type="submit" [disabled]="submitting">
    {{ submitting ? 'Iniciando sesión…' : 'Iniciar sesión' }}
  </button>

  <p *ngIf="errorMessage" class="feedback error" role="alert">
    {{ errorMessage }}
  </p>

  <p *ngIf="successMessage" class="feedback success" role="status">
    {{ successMessage }}
  </p>
</form>
