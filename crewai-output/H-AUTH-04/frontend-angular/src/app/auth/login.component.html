<!-- login.component.html -->
<main class="login-page">
  <section class="login-card" aria-labelledby="login-title">
    <h1 id="login-title">Iniciar sesión</h1>
    <p id="login-description">Ingresa tu usuario y contraseña.</p>

    <div *ngIf="errorMessage" class="message message-error" role="alert">
      {{ errorMessage }}
    </div>

    <p *ngIf="submitting" class="loading-message" role="status">
      Comprobando tus credenciales…
    </p>

    <form
      *ngIf="!loginSucceeded; else successTemplate"
      [formGroup]="form"
      (ngSubmit)="submit()"
      [attr.aria-busy]="submitting"
      aria-describedby="login-description"
      novalidate
    >
      <fieldset [disabled]="submitting">
        <legend class="visually-hidden">Datos de inicio de sesión</legend>

        <div class="form-field">
          <label for="username">Usuario</label>
          <input
            #usernameInput
            id="username"
            name="username"
            type="text"
            formControlName="username"
            autocomplete="username"
            required
            [attr.aria-invalid]="usernameInvalid ? 'true' : null"
            [attr.aria-describedby]="usernameInvalid ? 'username-error' : null"
          />

          <p
            *ngIf="usernameInvalid"
            id="username-error"
            class="field-error"
          >
            <span *ngIf="usernameControl.hasError('required')">
              Ingresa tu usuario.
            </span>
            <span *ngIf="usernameControl.hasError('pattern')">
              El usuario no puede contener solo espacios.
            </span>
          </p>
        </div>

        <div class="form-field">
          <label for="password">Contraseña</label>
          <input
            #passwordInput
            id="password"
            name="password"
            type="password"
            formControlName="password"
            autocomplete="current-password"
            required
            [attr.aria-invalid]="passwordInvalid ? 'true' : null"
            [attr.aria-describedby]="passwordInvalid ? 'password-error' : null"
          />

          <p
            *ngIf="passwordInvalid"
            id="password-error"
            class="field-error"
          >
            Ingresa tu contraseña.
          </p>
        </div>

        <button type="submit" [disabled]="submitting">
          {{ submitting ? 'Iniciando sesión…' : 'Iniciar sesión' }}
        </button>
      </fieldset>
    </form>

    <ng-template #successTemplate>
      <section class="message message-success" role="status" aria-live="polite">
        <h2>Sesión iniciada</h2>
        <p>Bienvenido, <strong>{{ signedInAs }}</strong>.</p>
      </section>
    </ng-template>
  </section>
</main>
